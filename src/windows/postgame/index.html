<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <link rel="stylesheet" href="styles.css" />
    <title>PepStats — Post-Game</title>
  </head>
  <body>
    <header class="titlebar">
      <span class="brand">PEPSTATS<span class="sub"> · POST-GAME REVIEW</span></span>
      <button id="close" class="close">✕</button>
    </header>

    <main class="dash">
      <section class="cards" id="cards">
        <div class="card"><div class="k">Champion</div><div class="v" id="c-champ">—</div></div>
        <div class="card"><div class="k">KDA</div><div class="v" id="c-kda">—</div></div>
        <div class="card"><div class="k">CS</div><div class="v" id="c-cs">—</div></div>
        <div class="card"><div class="k">CS / min</div><div class="v" id="c-cspm">—</div></div>
        <div class="card"><div class="k">Gold</div><div class="v" id="c-gold">—</div></div>
        <div class="card"><div class="k">Duration</div><div class="v" id="c-dur">—</div></div>
      </section>

      <section class="panel">
        <h2>AI Tactical Review</h2>
        <p class="muted">Generated by Claude from your own match data.</p>
        <button id="coach" class="btn">Get Tactical Review</button>
        <pre id="coach-out" class="coach-out"></pre>
      </section>
    </main>

    <script src="postgame.js"></script>
  </body>
</html>
