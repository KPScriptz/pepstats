<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self';" />
    <link rel="stylesheet" href="styles.css" />
    <title>PepStats Overlay</title>
  </head>
  <body>
    <!-- The frame is positioned + scaled (drag/resize in Design Mode); the inner
         .widget keeps its own entrance animation untouched by the frame transform. -->
    <div id="widget-frame">
      <div id="widget" class="widget hidden">
      <div class="brand-row" id="drag-handle">
        <span class="brand">PEPSTATS</span>
        <span id="rank-tag" class="rank-tag"></span>
        <span id="live-dot" class="live-dot"></span>
      </div>

      <div class="stats">
        <div class="stat-row" id="row-csm">
          <span class="stat-label">CSM</span>
          <span class="stat-vals">
            <span id="csm" class="v-you">—</span>
            <svg id="spark" class="spark" viewBox="0 0 64 22" preserveAspectRatio="none" aria-hidden="true">
              <polyline id="spark-line" class="spark-line" points="" />
              <circle id="spark-dot" class="spark-dot" cx="-9" cy="0" r="2.1" />
            </svg>
            <!-- Pro-pace pip: green when at/above Challenger CS/min, dim red below. -->
            <span id="csm-pace" class="pace-pip hidden" title="vs Challenger pace (8.5 CS/min)"></span>
          </span>
        </div>

        <div class="stat-row" id="row-gpm">
          <span class="stat-label">GPM</span>
          <span class="stat-vals"><span id="gpm" class="v-you">—</span></span>
        </div>

        <div class="stat-row" id="row-vision">
          <span class="stat-label">VIS</span>
          <span class="stat-vals">
            <span id="vis-you" class="v-you">—</span>
            <span class="v-sep">/</span>
            <span id="vis-base" class="v-base">—</span>
          </span>
        </div>

        <div class="stat-row" id="row-kp">
          <span class="stat-label">KP%</span>
          <span class="stat-vals">
            <span id="kp-you" class="v-you">—</span>
            <span class="v-sep">/</span>
            <span id="kp-base" class="v-base">—</span>
          </span>
        </div>

        <div class="stat-row" id="row-kda">
          <span class="stat-label">KDA</span>
          <span class="stat-vals">
            <span id="kda-you" class="v-you">—</span>
            <span class="v-sep">/</span>
            <span id="kda-base" class="v-base">—</span>
          </span>
        </div>

        <div class="stat-row" id="row-lvl">
          <span class="stat-label">LVL</span>
          <span class="stat-vals">
            <span id="lvl-you" class="v-you">—</span>
          </span>
        </div>
      </div>

      <!-- Skill-order hint: which ability to put your next point into. -->
      <div class="skill-row hidden" id="skill-row">
        <span class="stat-label">MAX NEXT</span>
        <span class="skill-badges" id="skill-badges"></span>
      </div>

      <div class="divider" id="divider"></div>
      <div class="timeline" id="timeline">
        <!-- Objective nodes are rendered from the timers array in ingame.js -->
      </div>

      <div id="status" class="status">Waiting for a live game…</div>
      </div>
      <!-- Resize grip — visible only in Design Mode. -->
      <span id="resize-handle" class="resize-handle" title="Drag to resize"></span>
    </div>
    <script src="../theme.js"></script>
    <script src="../themeEngine.js"></script>
    <script src="ingame.js"></script>
  </body>
</html>
