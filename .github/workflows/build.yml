name: Build Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Optional Python backend (disabled by default) -----------------
      # The app runs fully on Node. To ship the bundled Python sidecar,
      # uncomment this block: it builds backend/dist/pepstats-backend.exe,
      # which package.json's extraResources then packs into the installer.
      #
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      # - name: Build Python backend
      #   run: |
      #     pip install pyinstaller
      #     pyinstaller backend/pepstats_backend.spec --distpath backend/dist
      # -------------------------------------------------------------------

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PepStats-Setup
          path: dist/*.exe

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          # latest.yml is the auto-updater feed (electron-updater generic
          # provider points at this release's download URL).
          files: |
            dist/*.exe
            dist/latest.yml

  build-mac:
    # Serialize after the Windows job so both don't race to create the rolling
    # `latest` release. The Mac app is unsigned (Gatekeeper: right-click → Open)
    # and does not auto-update — auto-update stays Windows-only.
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build macOS app (unsigned)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # don't attempt signing on CI

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PepStats-mac
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: |
            dist/*.dmg
            dist/*.zip
